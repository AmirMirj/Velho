openapi: 3.0.3
info:
  title: Proof Before Pitch API
  version: 0.1.0
  description: >
    Stateless generation of a Velho internal proof pack from a public company
    identifier. No send/contact endpoints. No pack persistence.
servers:
  - url: http://localhost:3000
    description: Local Next.js dev server
paths:
  /api/packs:
    post:
      operationId: generateProofPack
      summary: Generate a session-consumed proof pack
      description: >
        Fetches public pages for the company and returns a ProofPack JSON body.
        Client holds the result in session; server does not store packs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePackRequest'
            examples:
              domain:
                value:
                  input: "https://www.kone.com"
              name:
                value:
                  input: "KONE"
      responses:
        '200':
          description: Pack generated (complete or partial)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofPack'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: Upstream fetch or LLM failure with no usable pack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofPack'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    GeneratePackRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 500
          description: Company domain, URL, or name
    ProofPack:
      type: object
      required:
        - status
        - signals
        - opportunities
        - drafts
        - gaps
        - generatedAt
        - warnings
      properties:
        status:
          type: string
          enum: [complete, partial, error]
        company:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TargetCompany'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/PublicSignal'
        opportunities:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/OpportunityHypothesis'
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/OutreachDraft'
        gaps:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
    TargetCompany:
      type: object
      required: [name, domain, inputRaw, snapshot]
      properties:
        name:
          type: string
        domain:
          type: string
        inputRaw:
          type: string
        snapshot:
          type: string
        industryHint:
          type: string
          nullable: true
        sizeHint:
          type: string
          nullable: true
    PublicSignal:
      type: object
      required: [id, sourceLabel, sourceUrl, excerpt, whyItMatters]
      properties:
        id:
          type: string
        sourceLabel:
          type: string
        sourceUrl:
          type: string
          format: uri
        excerpt:
          type: string
        whyItMatters:
          type: string
    OpportunityHypothesis:
      type: object
      required:
        - id
        - title
        - valueScore
        - effortScore
        - rank
        - rationale
        - tryFirst
        - confidence
        - signalIds
      properties:
        id:
          type: string
        title:
          type: string
        valueScore:
          type: number
          minimum: 1
          maximum: 5
        effortScore:
          type: number
          minimum: 1
          maximum: 5
        rank:
          type: integer
          minimum: 1
        rationale:
          type: string
        tryFirst:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        signalIds:
          type: array
          items:
            type: string
    OutreachDraft:
      type: object
      required: [channel, addresseeRole, body, draftLabel, relatedOpportunityIds]
      properties:
        channel:
          type: string
          enum: [email, linkedin]
        addresseeRole:
          type: string
          example: COO / Head of Operations
        subject:
          type: string
          nullable: true
        body:
          type: string
        draftLabel:
          type: string
          description: Must mark as internal draft; UI must not offer send
        relatedOpportunityIds:
          type: array
          items:
            type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
```
